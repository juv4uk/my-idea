name: Publish Release · Публікація · Veröffentlichung

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require an existing semantic-version tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"

  build-desktop:
    name: Desktop · ${{ matrix.platform }}
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
      - name: Install wasm-pack · Встановити wasm-pack · wasm-pack installieren
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ runner.os }}
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf pkg-config
      - run: bun install --frozen-lockfile
      - name: Read trilingual release notes
        id: notes
        shell: bash
        run: |
          NOTES_PATH=".github/release-notes/${RELEASE_TAG}.md"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            if [ -f "$NOTES_PATH" ]; then
              cat "$NOTES_PATH"
            else
              echo 'Release notes are generated from the changes included in this version.'
              echo
              echo 'Нотатки до релізу сформовано зі змін, що увійшли до цієї версії.'
              echo
              echo 'Die Versionshinweise werden aus den Änderungen dieser Version erstellt.'
            fi
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Build and publish desktop packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: my-idea ${{ env.RELEASE_TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          assetNamePattern: '[name]_[version]_[arch][setup][ext]'
          args: ${{ matrix.args }}

  build-arm-linux:
    name: Linux ARM64 · Raspberry Pi
    needs: build-desktop
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack · Встановити wasm-pack · wasm-pack installieren
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-arm64
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf pkg-config xdg-utils libfuse2
      - run: bun install --frozen-lockfile
      - run: bunx tauri build
      - name: Upload ARM64 packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p arm64-artifacts
          find . -name "*.deb" -not -path "*/node_modules/*" -exec cp {} arm64-artifacts/ \; 2>/dev/null || true
          find . -name "*.AppImage" -not -path "*/node_modules/*" -exec cp {} arm64-artifacts/ \; 2>/dev/null || true
          find . -name "*.rpm" -not -path "*/node_modules/*" -exec cp {} arm64-artifacts/ \; 2>/dev/null || true
          test -n "$(find arm64-artifacts -type f -print -quit)"
          gh release upload "$RELEASE_TAG" arm64-artifacts/* --clobber

  build-windows-arm64:
    name: Windows ARM64 · native NSIS
    needs: build-desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,wasm32-unknown-unknown
      - name: Install wasm-pack · Встановити wasm-pack · wasm-pack installieren
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-arm64
      - name: Activate ARM64 MSVC tools · Активувати ARM64 MSVC · ARM64-MSVC aktivieren
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64
      - name: Verify Microsoft ARM64 linker · Перевірити linker · MSVC-Linker prüfen
        shell: pwsh
        run: |
          # The x64 runner must host the ARM64 cross-tools; a native ARM64 host tool cannot run here.
          # x64 runner має запускати ARM64 cross-tools; нативний ARM64 host tool тут не виконується.
          # Der x64-Runner muss die ARM64-Cross-Tools hosten; ein natives ARM64-Host-Tool läuft hier nicht.
          $linker = Get-Command link.exe -CommandType Application | Select-Object -First 1
          if (-not $linker -or $linker.Source -notmatch '[\\/]VC[\\/]Tools[\\/]MSVC[\\/]') {
            throw "Microsoft MSVC linker is not first on PATH: $($linker.Source)"
          }
          Write-Host "Using ARM64 cross-linker: $($linker.Source)"
      - name: Install frontend dependencies · Встановити залежності · Abhängigkeiten installieren
        run: bun install --frozen-lockfile
      - name: Build native Windows ARM64 · Зібрати Windows ARM64 · Windows ARM64 bauen
        run: bun run tauri build --target aarch64-pc-windows-msvc --bundles nsis
      - name: Verify ARM64 PE header · Перевірити PE-заголовок · PE-Kopf prüfen
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Filter 'my-idea.exe' -Recurse | Where-Object { $_.FullName -notmatch 'node_modules' } | Select-Object -First 1
          if (-not $exe) { throw 'my-idea.exe was not found for PE header verification.' }
          ./scripts/verify-windows-architecture.ps1 -Path $exe.FullName -ExpectedMachine 0xAA64
      - name: Upload Windows ARM64 installer · Завантажити installer · Installer hochladen
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -Path . -Filter '*.exe' -Recurse | Where-Object { $_.FullName -match 'nsis' -and $_.FullName -notmatch 'node_modules' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows ARM64 NSIS installer was not produced.' }
          $asset = "my-idea_$($env:RELEASE_TAG.TrimStart('v'))_arm64-setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $asset
          gh release upload $env:RELEASE_TAG $asset --clobber

  build-flatpak:
    name: Linux Flatpak · x86_64
    needs: build-desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack · Встановити wasm-pack · wasm-pack installieren
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-Linux
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf pkg-config flatpak flatpak-builder
      - run: bun install --frozen-lockfile
      - run: bunx tauri build
      - name: Build Flatpak bundle
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08
          DEB_FILE="$(find . -name '*.deb' -not -path '*/node_modules/*' | head -n 1)"
          test -f "$DEB_FILE"
          cp "$DEB_FILE" my-idea.deb
          cat > com.juv4u.my-idea.yml <<'EOF'
          app-id: com.juv4u.my-idea
          runtime: org.freedesktop.Platform
          runtime-version: '23.08'
          sdk: org.freedesktop.Sdk
          command: my-idea
          finish-args:
            - --socket=wayland
            - --socket=fallback-x11
            - --share=ipc
            - --filesystem=home
            - --device=dri
          modules:
            - name: my-idea
              buildsystem: simple
              build-commands:
                - ar x my-idea.deb
                - tar -xf data.tar.*
                - install -D usr/bin/my-idea /app/bin/my-idea
                - cp -r usr/share /app/share
              sources:
                - type: file
                  path: my-idea.deb
          EOF
          flatpak-builder --repo=repo --force-clean flatpak-build com.juv4u.my-idea.yml
          flatpak build-bundle repo "my-idea_${RELEASE_TAG#v}_x86_64.flatpak" com.juv4u.my-idea
      - name: Upload Flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "my-idea_${RELEASE_TAG#v}_x86_64.flatpak" --clobber

  build-web:
    name: Portable Web · single HTML
    needs: build-desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack · Встановити wasm-pack · wasm-pack installieren
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Create and verify standalone Web file
        run: |
          node scripts/make-portable-web.mjs dist/index.html my-idea-web.html
          test -s my-idea-web.html
      - name: Upload portable Web file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" my-idea-web.html --clobber

  build-android:
    name: Android · signed APK and AAB
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: true
      - name: Check signing gate · Перевірити підпис · Signatur prüfen
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Android release waits for all four signing secrets.'
            echo 'Android-реліз очікує всі чотири секрети підпису.'
            echo 'Das Android-Release wartet auf alle vier Signatur-Secrets.'
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.signing.outputs.ready == 'true'
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        if: steps.signing.outputs.ready == 'true'
        with:
          node-version: lts/*
      - uses: actions/setup-java@v5
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        if: steps.signing.outputs.ready == 'true'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown
      - name: Install wasm-pack · Встановити wasm-pack · wasm-pack installieren
        if: steps.signing.outputs.ready == 'true'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'
      - uses: Swatinem/rust-cache@v2
        if: steps.signing.outputs.ready == 'true'
        with:
          workspaces: src-tauri -> target
          shared-key: android
      - name: Install frontend dependencies · Встановити залежності · Abhängigkeiten installieren
        if: steps.signing.outputs.ready == 'true'
        run: bun install --frozen-lockfile
      - name: Initialize Android project · Ініціалізувати Android · Android initialisieren
        if: steps.signing.outputs.ready == 'true'
        run: |
          # Regenerate from the tagged config; inherited generated files may carry an older package identity.
          # Перегенеровуємо з конфігурації тегу; успадковані файли можуть мати старий package identity.
          # Aus der Tag-Konfiguration neu erzeugen; übernommene Dateien können eine alte Paketidentität tragen.
          test "$PWD" = "$GITHUB_WORKSPACE"
          rm -rf -- "$GITHUB_WORKSPACE/src-tauri/gen/android"
          bun run tauri android init --ci
          node scripts/configure-android-signing.mjs
      - name: Configure signing · Налаштувати підпис · Signatur konfigurieren
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-idea-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/my-idea-release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
      - name: Build signed Android packages · Зібрати Android · Android-Pakete bauen
        if: steps.signing.outputs.ready == 'true'
        run: bun run tauri android build --apk --aab --ci
      - name: Upload Android packages · Завантажити Android · Android-Pakete hochladen
        if: steps.signing.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p android-artifacts
          VERSION="${RELEASE_TAG#v}"
          APK_FILE="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' | head -n 1)"
          AAB_FILE="$(find src-tauri/gen/android/app/build/outputs -type f -name '*.aab' | head -n 1)"
          test -f "$APK_FILE"
          test -f "$AAB_FILE"
          cp "$APK_FILE" "android-artifacts/my-idea_${VERSION}_android.apk"
          cp "$AAB_FILE" "android-artifacts/my-idea_${VERSION}_android.aab"
          gh release upload "$RELEASE_TAG" android-artifacts/* --clobber
