name: CLI Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: my-lisp-cli
            asset_name: my-lisp-cli-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: my-lisp-cli.exe
            asset_name: my-lisp-cli-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: my-lisp-cli
            asset_name: my-lisp-cli-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: my-lisp-cli
            asset_name: my-lisp-cli-macos-arm64
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Build CLI
        run: cargo build --release -p my-lisp-cli --target ${{ matrix.target }}
        
      - name: Upload Binary
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
