name: CLI Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: my-lisp
            asset_suffix: linux_amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: my-lisp.exe
            asset_suffix: windows_x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: my-lisp
            asset_suffix: macos_x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: my-lisp
            asset_suffix: macos_arm64
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Build CLI
        run: cargo build --release -p my-lisp-cli --target ${{ matrix.target }}
        
      - name: Rename Binary
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SRC="target/${{ matrix.target }}/release/${{ matrix.artifact_name }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            DST="my-lisp-cli_${VERSION}_${{ matrix.asset_suffix }}.exe"
          else
            DST="my-lisp-cli_${VERSION}_${{ matrix.asset_suffix }}"
          fi
          mv "$SRC" "$DST"
          echo "ASSET_PATH=$DST" >> $GITHUB_ENV
          
      - name: Upload Binary
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ASSET_PATH }}
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
