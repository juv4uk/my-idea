name: help-api-registry-lifecycle-patch

on:
  push:
    branches:
      - feat/help-lisp-api-44

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/help-lisp-api-44
          fetch-depth: 0
      - name: Make Help installation re-establish capabilities
        shell: python
        run: |
          from pathlib import Path

          path = Path("src-tauri/src/help_api.rs")
          text = path.read_text()
          text = text.replace("use std::sync::Once;\n", "")
          old = '''fn ensure_capabilities_installed() {
    static INSTALL: Once = Once::new();
    INSTALL.call_once(|| {
        register_capability("help/topic", help_topic);
        register_capability("help/search", help_search);
        register_capability("help/source", help_source);
        register_capability("help/related", help_related);
    });
}
'''
          new = '''fn install_capabilities() {
    // The upstream capability registry is deliberately mutable: re-registering
    // replaces a handler and a host may withdraw capabilities. Installing a
    // HelpRegistry must therefore establish its four surfaces *now*, rather
    // than relying on a process-lifetime Once that can become stale.
    register_capability("help/topic", help_topic);
    register_capability("help/search", help_search);
    register_capability("help/source", help_source);
    register_capability("help/related", help_related);
}
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("expected Help capability installation block not found")
          text = text.replace("        ensure_capabilities_installed();\n", "        install_capabilities();\n", 1)
          path.write_text(text)
      - name: Commit lifecycle fix if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/src/help_api.rs; then
            echo "Help registry lifecycle fix already present"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/help_api.rs
          git commit -m "fix(help): reinstall capabilities for each registry (#44)"
          git push origin HEAD:feat/help-lisp-api-44
