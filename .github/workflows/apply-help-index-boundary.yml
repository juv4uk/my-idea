name: Apply help-index public boundary

on:
  push:
    branches:
      - feat/help-index-43

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/help-index-43
          fetch-depth: 0

      - name: Patch lib.rs exactly once
        shell: python
        run: |
          from pathlib import Path
          path = Path("src-tauri/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          needle = "mod ecosystem;\n"
          replacement = "mod ecosystem;\npub use ecosystem::{documentation, documentation_index, documentation_search};\n"
          if replacement in text:
              raise SystemExit(0)
          if text.count(needle) != 1:
              raise SystemExit(f"expected exactly one ecosystem declaration, found {text.count(needle)}")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/src/lib.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs
          git commit -m "feat(help): expose documentation index boundary"
          git push origin HEAD:feat/help-index-43
