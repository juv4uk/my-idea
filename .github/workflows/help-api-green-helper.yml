name: help-api-green-helper

on:
  push:
    branches:
      - feat/help-lisp-api-44

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/help-lisp-api-44
          fetch-depth: 0
      - name: Wire Help API without rewriting large source files
        shell: python
        run: |
          from pathlib import Path

          lib = Path("src-tauri/src/lib.rs")
          text = lib.read_text()
          needle = "pub mod editor_api;\n"
          replacement = needle + "pub mod help_api;\n"
          if "pub mod help_api;" not in text:
              if needle not in text:
                  raise SystemExit("lib.rs module insertion point not found")
              text = text.replace(needle, replacement, 1)
              lib.write_text(text)

          repl = Path("src-tauri/src/repl.rs")
          text = repl.read_text()
          import_needle = "use crate::editor_api::{EditorCommandRegistry, EditorEffect, EditorState};\n"
          import_replacement = import_needle + "use crate::help_api::{HelpCatalog, HelpRegistry};\n"
          if "use crate::help_api::{HelpCatalog, HelpRegistry};" not in text:
              if import_needle not in text:
                  raise SystemExit("repl.rs import insertion point not found")
              text = text.replace(import_needle, import_replacement, 1)

          install_needle = "                let registry = EditorCommandRegistry::new();\n                registry.install_into(&mut session);\n"
          install_replacement = install_needle + "                let help_registry = HelpRegistry::new(HelpCatalog::new(crate::documentation_index()));\n                help_registry.install_into(&mut session);\n"
          if "let help_registry = HelpRegistry::new" not in text:
              if install_needle not in text:
                  raise SystemExit("repl.rs registry insertion point not found")
              text = text.replace(install_needle, install_replacement, 1)
          repl.write_text(text)
      - name: Commit source wiring if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src-tauri/src/lib.rs src-tauri/src/repl.rs; then
            echo "Help API wiring already present"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src-tauri/src/lib.rs src-tauri/src/repl.rs
          git commit -m "feat(help): install Help API in live REPL session (#44)"
          git push origin HEAD:feat/help-lisp-api-44
