name: CI · Перевірка · Prüfung

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack · Встановити wasm-pack · wasm-pack installieren
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install Tauri Linux system dependencies · Встановити системні залежності Tauri для Linux · Tauri-Linux-Systemabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf pkg-config
      - run: npm ci
      - run: npm run build
      - run: node scripts/make-portable-web.mjs dist/index.html my-idea-web.html
      - name: Install Playwright Browsers · Встановити браузери Playwright · Playwright-Browser installieren
        run: npx playwright install chromium --with-deps
      - run: npm test
      - run: npm run check
      - name: Check my-idea against the my-lisp git dependency · Перевірити my-idea проти git-залежності my-lisp · my-idea gegen die my-lisp-Git-Abhängigkeit prüfen
        run: cargo check --manifest-path src-tauri/Cargo.toml
