name: CI · Перевірка · Prüfung

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack · Встановити wasm-pack · wasm-pack installieren
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: npm ci
      - run: npm run build
      - run: node scripts/make-portable-web.mjs dist/index.html my-idea-web.html
      - name: Build standalone my-lisp-cli-web.html · Зібрати my-lisp-cli-web.html · my-lisp-cli-web.html bauen
        run: node scripts/make-portable-web.mjs dist/my-lisp-cli-web.html my-lisp-cli-web.html
      - name: Install Playwright Browsers · Встановити браузери Playwright · Playwright-Browser installieren
        run: npx playwright install chromium --with-deps
      - run: npm test
      - run: npm run check
      - name: Test my-lisp Rust core · Тест Rust-ядра my-lisp · my-lisp-Rust-Kern testen
        run: cargo test --manifest-path crates/my-lisp/Cargo.toml
      - name: Test my-lisp CLI · Тест CLI my-lisp · my-lisp-CLI testen
        run: cargo test --manifest-path crates/my-lisp-cli/Cargo.toml
      - name: Test my-lisp-literate · Тест my-lisp-literate · my-lisp-literate testen
        run: cargo test --manifest-path crates/my-lisp-literate/Cargo.toml
