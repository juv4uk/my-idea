name: CI · Перевірка · Prüfung

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Exact merged CML revision that provides the host-integration `cml-compile`
  # process boundary. Keep this immutable: provenance assertions below depend
  # on the binary being built from precisely this checkout.
  CML_REVISION: fde90ea3512dacee4272f0c8f8be531831adf277

jobs:
  hosted-web:
    name: Hosted compatibility lane
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN || github.token }}
          submodules: recursive
      - name: Verify single my-lisp pin channel · Перевірити єдиний канал pin my-lisp · Einzelnen my-lisp-Pin-Kanal prüfen
        run: python3 scripts/check-my-lisp-sync.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack · Встановити wasm-pack · wasm-pack installieren
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install Tauri Linux system dependencies · Встановити системні залежності Tauri для Linux · Tauri-Linux-Systemabhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev patchelf pkg-config
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: node scripts/make-portable-web.mjs dist/index.html my-idea-web.html
      - name: Install Playwright Browsers · Встановити браузери Playwright · Playwright-Browser installieren
        run: bunx playwright install chromium --with-deps
      - run: bun run test
      - run: bun run check
      - name: Build my-lisp CLI sidecar for tests · Зібрати sidecar my-lisp для тестів
        run: bash scripts/build-repl-sidecar.sh
      - name: Checkout exact CML witness source
        uses: actions/checkout@v5
        with:
          repository: juv4uk/cml
          ref: ${{ env.CML_REVISION }}
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: recursive
          path: .ci-cml
          fetch-depth: 1
      - name: Build pinned CML host compiler · Зібрати зафіксований CML host compiler
        shell: bash
        run: |
          set -euo pipefail
          CML_DIR="${GITHUB_WORKSPACE}/.ci-cml"
          test "$(git -C "${CML_DIR}" rev-parse HEAD)" = "${CML_REVISION}"
          cargo build --locked --release --manifest-path "${CML_DIR}/Cargo.toml" --bin cml-compile
          echo "MY_IDEA_CML_TEST_DIR=${CML_DIR}" >> "${GITHUB_ENV}"
          echo "MY_IDEA_CML_TEST_BIN=${CML_DIR}/target/release/cml-compile" >> "${GITHUB_ENV}"
          echo "MY_IDEA_CML_TEST_REVISION=${CML_REVISION}" >> "${GITHUB_ENV}"
      - name: Execute Rust witness tests · Виконати Rust тести-свідки · Rust-Zeugentests ausführen
        run: cargo test --manifest-path src-tauri/Cargo.toml --tests
      - name: Expose real-CML provenance evidence · Показати provenance реального CML
        shell: bash
        run: |
          set -euo pipefail
          LOG="${RUNNER_TEMP}/real-cml-provenance.log"
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test real_cml_compiler_contract \
            pinned_real_cml_flows_through_production_build_and_run_with_exact_provenance \
            -- --exact --nocapture 2>&1 | tee "${LOG}"
          grep -F "real-cml provenance: compiler=cml-compile compiler_revision=${MY_IDEA_CML_TEST_REVISION}" "${LOG}"
          grep -E 'input_revision=[0-9a-f]{40} artifact=.+' "${LOG}"

  local-web:
    name: Local my-idea CI
    runs-on: [self-hosted, guix]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0
      - name: Materialize exact SENS pin from local sibling checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          SENS_PIN="$(git rev-parse :external/sens)"
          SENS_SOURCE=""
          for candidate in /mnt/c/GitHub/sens /home/agents/GitHub/sens; do
            if git -C "${candidate}" cat-file -e "${SENS_PIN}^{commit}" 2>/dev/null; then
              SENS_SOURCE="${candidate}"
              break
            fi
          done
          test -n "${SENS_SOURCE}" || {
            echo "exact SENS pin ${SENS_PIN} is absent from local sibling checkouts" >&2
            exit 1
          }
          rm -rf external/sens
          git clone --quiet --no-checkout --no-hardlinks "${SENS_SOURCE}" external/sens
          git -C external/sens checkout --quiet --detach "${SENS_PIN}"
          test "$(git -C external/sens rev-parse HEAD)" = "${SENS_PIN}"
          python3 scripts/check-my-lisp-sync.py
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Verify Guix and install wasm-pack when needed
        shell: bash
        run: |
          set -euo pipefail
          command -v guix
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
      - name: Frontend and SENS integration gates
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
          node scripts/make-portable-web.mjs dist/index.html my-idea-web.html
          bun run test
          bun run check
      - name: Build exact pinned sidecar
        run: bash scripts/build-repl-sidecar.sh
      - name: Materialize exact CML witness source from local sibling checkout
        shell: bash
        run: |
          set -euo pipefail
          CML_SOURCE=""
          for candidate in /mnt/c/GitHub/cml /home/agents/GitHub/cml; do
            if git -C "${candidate}" cat-file -e "${CML_REVISION}^{commit}" 2>/dev/null; then
              CML_SOURCE="${candidate}"
              break
            fi
          done
          test -n "${CML_SOURCE}" || {
            echo "exact CML pin ${CML_REVISION} is absent from local sibling checkouts" >&2
            exit 1
          }

          rm -rf .ci-cml
          git clone --quiet --no-checkout --no-hardlinks "${CML_SOURCE}" .ci-cml
          git -C .ci-cml checkout --quiet --detach "${CML_REVISION}"
          test "$(git -C .ci-cml rev-parse HEAD)" = "${CML_REVISION}"

          CML_SENS_PIN="$(git -C .ci-cml rev-parse :external/sens)"
          SENS_SOURCE=""
          for candidate in /mnt/c/GitHub/sens /home/agents/GitHub/sens; do
            if git -C "${candidate}" cat-file -e "${CML_SENS_PIN}^{commit}" 2>/dev/null; then
              SENS_SOURCE="${candidate}"
              break
            fi
          done
          test -n "${SENS_SOURCE}" || {
            echo "CML's exact SENS pin ${CML_SENS_PIN} is absent locally" >&2
            exit 1
          }
          rm -rf .ci-cml/external/sens
          git clone --quiet --no-checkout --no-hardlinks "${SENS_SOURCE}" .ci-cml/external/sens
          git -C .ci-cml/external/sens checkout --quiet --detach "${CML_SENS_PIN}"
          test "$(git -C .ci-cml/external/sens rev-parse HEAD)" = "${CML_SENS_PIN}"

          CML_DIR="${GITHUB_WORKSPACE}/.ci-cml"
          cargo build --locked --release --manifest-path "${CML_DIR}/Cargo.toml" --bin cml-compile
          echo "MY_IDEA_CML_TEST_DIR=${CML_DIR}" >> "${GITHUB_ENV}"
          echo "MY_IDEA_CML_TEST_BIN=${CML_DIR}/target/release/cml-compile" >> "${GITHUB_ENV}"
          echo "MY_IDEA_CML_TEST_REVISION=${CML_REVISION}" >> "${GITHUB_ENV}"
      - name: Rust witnesses inside declared Guix environment
        shell: bash
        run: |
          set -euo pipefail
          guix shell --pure -m manifest.scm -- bash -lc '
            export SSL_CERT_DIR="$GUIX_ENVIRONMENT/etc/ssl/certs"
            export MY_IDEA_CML_TEST_DIR="'"$MY_IDEA_CML_TEST_DIR"'"
            export MY_IDEA_CML_TEST_BIN="'"$MY_IDEA_CML_TEST_BIN"'"
            export MY_IDEA_CML_TEST_REVISION="'"$MY_IDEA_CML_TEST_REVISION"'"
            cargo test --manifest-path src-tauri/Cargo.toml --tests
            cargo test --manifest-path src-tauri/Cargo.toml \
              --test real_cml_compiler_contract \
              pinned_real_cml_flows_through_production_build_and_run_with_exact_provenance \
              -- --exact --nocapture
          '
