name: TUI · my-idea-tui · Ratatui

# Раннери — тільки GitHub-hosted (як і решта my-idea). Self-hosted заборонено
# політикою репо; тут явно `ubuntu-24.04`.
on:
  push:
    branches: [main]
    paths:
      - "my-idea-tui/**"
      - "src-tauri/src/workspace_save.rs"
      - ".github/workflows/tui.yml"
  pull_request:
    paths:
      - "my-idea-tui/**"
      - "src-tauri/src/workspace_save.rs"
      - ".github/workflows/tui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build my-idea-tui (GitHub-hosted runner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify real workspace save and build Ratatui
        run: |
          cargo test --manifest-path my-idea-tui/Cargo.toml
          cargo build --release --manifest-path my-idea-tui/Cargo.toml
