name: TUI · my-idea-tui · Ratatui

# Рішення власника від 19.10.2026: TUI на локальному Linux/X64 runner.
# Інші jobs/релізні матриці не перенаправляти без окремого аналізу.
on:
  push:
    branches: [main]
    paths:
      - "my-idea-tui/**"
      - "src-tauri/src/workspace_save.rs"
      - "external/sens"
      - ".github/workflows/tui.yml"
  pull_request:
    paths:
      - "my-idea-tui/**"
      - "src-tauri/src/workspace_save.rs"
      - "external/sens"
      - ".github/workflows/tui.yml"
  workflow_dispatch:

permissions:
  contents: read

# На малопотужному локальному ПК лише одна актуальна збірка TUI на гілку.
concurrency:
  group: my-idea-tui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build my-idea-tui (local Guix runner / hosted PR)
    # Реально доведена для my-idea мітка у #74 — [self-hosted, guix],
    # wsm-i5-6400; core-local і Linux/X64 не підтверджені для цієї реєстрації.
    # PR із чужим кодом НЕ виконувати на комп'ютері власника.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","guix"]') }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v5
        with:
          # Не покладатися на пошкоджений Git object store підмодуля в
          # постійному workspace локального runner (pack unresolved deltas).
          submodules: false
      - name: Отримати точний SENS gitlink без пошкодженого кешу підмодуля
        shell: bash
        run: |
          set -euo pipefail
          gitlink="$(git rev-parse HEAD:external/sens)"
          # Зачіпаємо тільки підмодуль всередині checkout поточного job.
          # Старий .git/modules/external/sens не можна повторно використати:
          # у локального runner саме він повертав '523 unresolved deltas'.
          rm -rf -- external/sens .git/modules/external/sens
          mkdir -p external/sens
          git -C external/sens init -q
          git -C external/sens remote add origin https://github.com/juv4uk/sens.git
          # GitHub підтримує fetch exact reachable commit; часткове отримання
          # уникає величезного старого pack і не змінює pinned SHA.
          git -C external/sens -c protocol.version=2 fetch \
            --no-tags --filter=blob:none --depth=1 origin "$gitlink"
          git -C external/sens checkout --detach --force FETCH_HEAD
          checked_out="$(git -C external/sens rev-parse HEAD)"
          test "$checked_out" = "$gitlink"
          printf 'PINNED_SENS_GITLINK=%s\n' "$gitlink"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify real workspace save and build Ratatui
        run: |
          cargo test --manifest-path my-idea-tui/Cargo.toml
          cargo build --release --manifest-path my-idea-tui/Cargo.toml
      - name: Встановити пінований Zig (потрібен sens-cli/build.rs)
        # wsm-guard-core/build.rs падає без пінованого Zig: build.rs вимагає Zig 0.16.0.
        uses: ./external/sens/.github/actions/install-zig
        with:
          version: "0.16.0"
      - name: "Реальний pinned SENS: перевірити SHA й зібрати file-mode CLI"
        shell: bash
        run: |
          set -euo pipefail
          gitlink="$(git rev-parse HEAD:external/sens)"
          checked_out="$(git -C external/sens rev-parse HEAD)"
          test "$checked_out" = "$gitlink"
          printf 'PINNED_SENS_GITLINK=%s\n' "$gitlink"
          cargo build --release --manifest-path external/sens/Cargo.toml -p sens-cli --bin my-lisp
      - name: Виконати через TUI Engine справжній SENS-файл і помилку синтаксису
        shell: bash
        env:
          SENS_PINNED_CLI: ${{ github.workspace }}/external/sens/target/release/my-lisp
        run: |
          set -euo pipefail
          # Не дозволяємо успіху з 0 виконаних тестів після паралельного редагування.
          proof="${RUNNER_TEMP}/pinned-sens-file-mode.log"
          cargo test --manifest-path my-idea-tui/Cargo.toml pinned_file_mode_smoke -- --ignored --nocapture 2>&1 | tee "$proof"
          grep -F 'PINNED_SENS_FILE_MODE_OK ' "$proof"
          grep -F 'PINNED_SENS_UKR_REPL_OK ' "$proof"
          grep -F 'PINNED_TUI_META_REPL_OK ' "$proof"
          grep -F '3 passed; 0 failed' "$proof"
