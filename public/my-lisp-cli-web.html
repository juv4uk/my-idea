<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1022" />
    <meta name="description" content="my-lisp CLI in the browser — no install needed · my-lisp CLI у браузері — без встановлення · my-lisp-CLI im Browser — keine Installation nötig" />
    <title>my-lisp-cli (Web)</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b1022;
        color: #d7f5e6;
        font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
      }
      #shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 0 12px;
        box-sizing: border-box;
      }
      header {
        padding: 16px 4px 8px;
        border-bottom: 1px solid #1f2a44;
      }
      header h1 {
        margin: 0 0 4px;
        font-size: 1.1rem;
        color: #ff9d5c;
      }
      header p {
        margin: 2px 0;
        font-size: 0.82rem;
        color: #7fd8c9;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 10px 4px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.92rem;
        line-height: 1.45;
      }
      .line-input { color: #7fd8c9; }
      .line-value { color: #d7f5e6; }
      .line-error { color: #ff6b6b; }
      .line-system { color: #6c7a9c; }
      #input-row {
        display: flex;
        align-items: center;
        border-top: 1px solid #1f2a44;
        padding: 10px 4px 16px;
        gap: 8px;
      }
      #prompt {
        color: #ff9d5c;
        white-space: nowrap;
      }
      #input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #d7f5e6;
        font: inherit;
        font-size: 0.95rem;
      }
      #input:disabled { color: #4a5578; }
    </style>
  </head>
  <body>
    <div id="shell">
      <header>
        <h1>my-lisp-cli · Web</h1>
        <p>A small language that grows itself, running in your browser — no install needed.</p>
        <p>Маленька мова, що вирощує себе, прямо в браузері — без встановлення.</p>
        <p>Eine kleine Sprache, die sich selbst wachsen lässt — im Browser, ohne Installation.</p>
      </header>
      <div id="log"></div>
      <div id="input-row">
        <span id="prompt">my-lisp&gt;</span>
        <input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" disabled placeholder="Loading my-lisp WASM…" />
      </div>
    </div>

    <!-- WASM loader shim: registers window.loadMyLispWasm. Same convention as public/index.html
         so scripts/make-portable-web.mjs can embed the WASM binary into a standalone HTML file. -->
    <script src="./wasm-loader.js"></script>
    <script>
      // The my-lisp-cli binary silently injects lib/core.my before the REPL starts
      // (see crates/my-lisp-cli/src/main.rs); this mirrors that so `identity`, `not`,
      // `pair`, `second`, `third`, `caar`, and `cadr` are available from the first line.
      // my-lisp-cli-бінарник тихо підвантажує lib/core.my перед стартом REPL; тут те
      // саме, щоб identity/not/pair/second/third/caar/cadr були доступні з першого рядка.
      // Die my-lisp-cli-Binärdatei lädt lib/core.my still vor dem REPL-Start; hier wird
      // dasselbe getan, damit identity/not/pair/second/third/caar/cadr sofort bereitstehen.
      const CORE_MY = "; my-lisp bootstrap library: derived behavior belongs in the language itself.\n"
        + "; Bootstrap-бібліотека my-lisp: похідна поведінка належить самій мові.\n"
        + "; my-lisp-Bootstrap-Bibliothek: Abgeleitetes Verhalten gehört in die Sprache selbst.\n"
        + "\n"
        + "(def identity (lambda (value) value))\n"
        + "\n"
        + "(def not\n"
        + "  (lambda (value)\n"
        + "    (cond\n"
        + "      (value '())\n"
        + "      (t t))))\n"
        + "\n"
        + "(def pair\n"
        + "  (lambda (left right)\n"
        + "    (cons left (cons right '()))))\n"
        + "\n"
        + "(def second\n"
        + "  (lambda (values)\n"
        + "    (car (cdr values))))\n"
        + "\n"
        + "(def third\n"
        + "  (lambda (values)\n"
        + "    (car (cdr (cdr values)))))\n"
        + "\n"
        + "(def caar\n"
        + "  (lambda (values)\n"
        + "    (car (car values))))\n"
        + "\n"
        + "(def cadr\n"
        + "  (lambda (values)\n"
        + "    (car (cdr values))))\n";

      const logEl = document.getElementById("log");
      const inputEl = document.getElementById("input");

      function printLine(text, className) {
        const div = document.createElement("div");
        if (className) div.className = className;
        div.textContent = text;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
      }

      // Committed lines form the REPL's persistent session: the WASM `evaluate()`
      // call is stateless (fresh Session::default() each time, see crates/my-lisp-wasm),
      // so a growing script buffer is re-evaluated on every line to fake a persistent
      // REPL — the same trick the desktop Language Lab editor uses on its whole buffer.
      // Закомічені рядки формують постійну сесію REPL: WASM-виклик `evaluate()`
      // без стану (щоразу новий Session::default(), див. crates/my-lisp-wasm), тому
      // буфер, що росте, переобчислюється на кожен рядок, імітуючи постійний REPL —
      // той самий прийом, що й desktop Language Lab-редактор на всьому буфері.
      const committed = [CORE_MY];
      const history = [];
      let historyIndex = -1;

      async function main() {
        let wasmModule;
        try {
          wasmModule = await window.loadMyLispWasm();
        } catch (error) {
          printLine("Error: could not load the my-lisp WASM module: " + error, "line-error");
          return;
        }

        printLine("my-lisp-cli (Web) — pure Rust my-lisp core compiled to WebAssembly.", "line-system");
        printLine("Type an expression and press Enter. Ctrl-L clears the screen.", "line-system");
        printLine("", "line-system");

        inputEl.disabled = false;
        inputEl.placeholder = "(+ 1 2)";
        inputEl.focus();

        inputEl.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            void submit(wasmModule);
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            if (history.length === 0) return;
            historyIndex = Math.max(0, (historyIndex === -1 ? history.length : historyIndex) - 1);
            inputEl.value = history[historyIndex] ?? "";
          } else if (event.key === "ArrowDown") {
            event.preventDefault();
            if (historyIndex === -1) return;
            historyIndex += 1;
            if (historyIndex >= history.length) {
              historyIndex = -1;
              inputEl.value = "";
            } else {
              inputEl.value = history[historyIndex];
            }
          } else if (event.key === "l" && event.ctrlKey) {
            event.preventDefault();
            logEl.innerHTML = "";
          }
        });
      }

      async function submit(wasmModule) {
        const line = inputEl.value.trim();
        if (!line) return;
        inputEl.value = "";
        history.push(line);
        historyIndex = -1;
        printLine("my-lisp> " + line, "line-input");

        const candidateSource = committed.join("\n") + "\n" + line;
        try {
          const evaluation = wasmModule.evaluate(candidateSource, "my-lisp");
          for (const out of evaluation.output || []) {
            printLine(out, "line-value");
          }
          printLine(evaluation.value, "line-value");
          // Only keep the line in the persistent session once it evaluated successfully,
          // so a bad line cannot corrupt future evaluations the way a real REPL wouldn't.
          // Рядок лишається в постійній сесії лише після успішного обчислення, тож
          // невдалий рядок не може зіпсувати наступні обчислення — як у справжньому REPL.
          committed.push(line);
        } catch (error) {
          printLine("Error: " + (error && error.message ? error.message : error), "line-error");
        }
      }

      main();
    </script>
  </body>
</html>
