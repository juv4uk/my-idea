[package]
name = "my-idea"
version = "0.11.0"
description = "Lightweight programming IDE / Легка IDE для програмування / Leichtgewichtige Programmier-IDE"
authors = ["juv4uk"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_idea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# indexmap 1.9.3 (pulled in transitively by tauri-build -> schemars 0.8) detects
# `std` availability via a build.rs autocfg probe when its own `std` Cargo
# feature isn't requested by anyone — that probe fails under this Guix rust
# toolchain, so `IndexMap` compiles with no default third type parameter and
# schemars's `IndexMap<K, V>` usage no longer type-checks. Declaring it here
# with `features = ["std"]` sidesteps the probe entirely (build-dependency
# feature unification is separate from regular deps under the edition-2021
# resolver, so this has to live in [build-dependencies], not [dependencies]).
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
my-lisp = { git = "https://github.com/juv4uk/my-lisp.git", branch = "main" }
my-lisp-literate = { git = "https://github.com/juv4uk/my-lisp.git", branch = "main" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"






