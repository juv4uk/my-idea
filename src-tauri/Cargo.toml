[package]
name = "my-idea"
version = "0.13.7"
description = "Lightweight programming IDE / Легка IDE для програмування / Leichtgewichtige Programmier-IDE"
authors = ["juv4uk"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_idea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# indexmap 1.9.3 (pulled in transitively by tauri-build -> schemars 0.8) detects
# `std` availability via a build.rs autocfg probe when its own `std` Cargo
# feature isn't requested by anyone — that probe fails under this Guix rust
# toolchain, so `IndexMap` compiles with no default third type parameter and
# schemars's `IndexMap<K, V>` usage no longer type-checks. Declaring it here
# with `features = ["std"]` sidesteps the probe entirely (build-dependency
# feature unification is separate from regular deps under the edition-2021
# resolver, so this has to live in [build-dependencies], not [dependencies]).
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
# Single-channel pin (SUBMODULE-DEPENDENCY-MODEL-2026-09-16): the
# external/my-lisp git submodule's checked-out SHA is the only place
# my-idea's my-lisp version is decided. No floating `branch = "main"`
# alongside it — this crate consumes several surfaces of the same tree
# (in-process eval here, the CLI subprocess behind the REPL console, and
# the WASM build), so all of them must resolve from one exact commit.
my-lisp = { path = "../external/my-lisp/crates/my-lisp" }
my-lisp-literate = { path = "../external/my-lisp/crates/my-lisp-literate" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
# Resolves/spawns the bundled my-lisp CLI sidecar for the REPL console
# (repl_console.rs) — a separate concern from the my-lisp/my-lisp-literate
# path deps above: those are a compiled-in library API (pinned to an exact
# commit on purpose, single-channel), while the sidecar is an external CLI
# tool driven over a stable stdin/stdout text protocol, deliberately built
# fresh from my-lisp's latest main during each my-idea release (see
# .github/workflows/publish-release.yml) rather than pinned.
tauri-plugin-shell = "2"





